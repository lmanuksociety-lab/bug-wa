<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WA Bug Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 20px rgba(0,255,136,0.1);
        }
        h1 { color: #00ff88; text-align: center; margin-bottom: 5px; }
        p { color: #888; text-align: center; margin-bottom: 30px; font-size: 12px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #888; font-size: 12px; margin-bottom: 8px; }
        input, select {
            width: 100%;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled { background: #333; color: #555; cursor: not-allowed; }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            text-align: center;
        }
        .status.error { background: rgba(255,68,68,0.1); color: #ff4444; }
        .status.success { background: rgba(0,255,136,0.1); color: #00ff88; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WA BUG TOOL</h1>
        <p>Advanced Crash & Lag Generator</p>
        
        <div class="form-group">
            <label>Target Number</label>
            <input type="number" id="target" placeholder="628xxx" required>
        </div>
        
        <div class="form-group">
            <label>Attack Type</label>
            <select id="type">
                <option value="crash_ui">Crash UI</option>
                <option value="lag_device">Lag Device</option>
            </select>
        </div>
        
        <button onclick="sendBug()" id="sendBtn">Kirim Serangan</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        async function sendBug() {
            const target = document.getElementById('target').value;
            const type = document.getElementById('type').value;
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('status');
            
            if (!target || target.length < 10) {
                status.className = 'status error';
                status.textContent = 'Error: Invalid number';
                status.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Processing...';
            
            try {
                const response = await fetch('/api/send-bug', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target, type })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    status.className = 'status success';
                    status.textContent = 'Success: ' + data.message;
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                status.className = 'status error';
                status.textContent = 'Error: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Kirim Serangan';
                status.style.display = 'block';
                setTimeout(() => status.style.display = 'none', 5000);
            }
        }
    </script>
</body>
</html>
